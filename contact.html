<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Oleh & Inna Wedding</title>
  <meta name="description" content="Contact information for Oleh & Inna's wedding - May 24-26, 2026 in Budva, Montenegro">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/envelope.css">
  
  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js" defer></script>
  
  <!-- App JS -->
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  
  <main>
    <div class="page">
      <!-- Page Header -->
      <div class="page-header">
        <div class="container">
          <h1 class="page-title" data-i18n="contact.title"></h1>
          <p class="page-subtitle" data-i18n="contact.subtitle"></p>
        </div>
      </div>

      <!-- Contact Content -->
      <section class="section reveal">
        <div class="container container-narrow">
          <div class="card-grid">
            <!-- Primary Contact -->
            <div class="contact-card reveal-item">
              <h3 class="contact-card-title" data-i18n="contact.primary.title"></h3>
              <p class="card-body" data-i18n="contact.primary.body"></p>
              
              <dl class="contact-info">
                <dt data-i18n="contact.primary.emailLabel"></dt>
                <dd data-i18n="contact.primary.emailValue"></dd>
                
                <dt data-i18n="contact.primary.phoneLabel"></dt>
                <dd data-i18n="contact.primary.phoneValue"></dd>
              </dl>
            </div>

            <!-- Day-of Contact -->
            <div class="contact-card reveal-item">
              <h3 class="contact-card-title" data-i18n="contact.dayof.title"></h3>
              <p class="card-body" data-i18n="contact.dayof.body"></p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  
  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
