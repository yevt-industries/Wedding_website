                  <text x="247" y="92" text-anchor="middle">FRI</text>
                  <text x="289" y="92" text-anchor="middle">SAT</text>
                </g>
                
                <!-- Calendar days -->
                <g fill="#2c2825" font-family="'Montserrat', sans-serif" font-size="16" font-weight="500">
                  <!-- Week 1: May 1-2 (Fri-Sat) -->

                  <text x="289" y="118" text-anchor="middle">2</text>

                  <text x="79" y="142" text-anchor="middle">4</text>

                  <text x="205" y="142" text-anchor="middle">7</text>
