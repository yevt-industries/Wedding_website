<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oleh & Inna | Wedding</title>
  <meta name="description" content="Wedding celebration of Oleh & Inna - May 24-26, 2026 in Budva, Montenegro">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/envelope.css">
  
  <!-- PhotoSwipe CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.css">
  
  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js" defer></script>
  
  <!-- App JS -->
  <script type="module" src="/assets/app.js"></script>
  <script type="module" src="/assets/gallery.js"></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  
  <main>
    <div class="page">
      
      <!-- ============================================
           HERO SECTION
           ============================================ -->
      <section id="home" class="hero">
        <div class="hero-bg" style="background-image: url('/photos/IMG_5015.jpeg'); background-color: #7d6a5a;"></div>
        <div class="hero-content">
          <h1 class="hero-title" data-i18n="home.heroTitle"></h1>
          <p class="hero-subtitle" data-i18n="home.heroSubtitle"></p>
          <p class="hero-tagline" data-i18n="home.heroTagline"></p>
          <div class="hero-ctas">
            <a href="#schedule" class="btn btn-primary" data-i18n="home.ctaPrimary"></a>
            <a href="#rsvp" class="btn btn-secondary" data-i18n="home.ctaSecondary"></a>
            <a href="/travel.html" class="btn btn-secondary" data-i18n="home.ctaTertiary"></a>
          </div>
        </div>
      </section>

      <!-- Intro Section -->
      <section class="section section-snap reveal">
        <div class="container">
          <div class="intro-section">
            <h2 class="intro-title" data-i18n="home.introTitle"></h2>
            <p class="intro-body" data-i18n="home.introBody1"></p>
            
            <!-- Countdown Timer -->
            <div class="countdown-wrapper">
              <div class="countdown" id="wedding-countdown">
                <div class="countdown-item">
                  <span class="countdown-value" id="countdown-days">000</span>
                  <span class="countdown-label">Days</span>
                </div>
                <div class="countdown-separator">:</div>
                <div class="countdown-item">
                  <span class="countdown-value" id="countdown-hours">00</span>
                  <span class="countdown-label">Hours</span>
                </div>
                <div class="countdown-separator">:</div>
                <div class="countdown-item">
                  <span class="countdown-value" id="countdown-minutes">00</span>
                  <span class="countdown-label">Minutes</span>
                </div>
                <div class="countdown-separator">:</div>
                <div class="countdown-item">
                  <span class="countdown-value" id="countdown-seconds">00</span>
                  <span class="countdown-label">Seconds</span>
                </div>
              </div>
              <p class="countdown-caption">until the wedding day ✨</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Venue & Dates -->
      <section class="section section-snap reveal">
        <div class="container">
          <div class="highlight-grid">
            <div class="highlight-card highlight-card-venue reveal-item">
              <div class="venue-image">
                <img src="/photos/IMG_5016.jpeg" alt="Villa Mona Lisa" loading="lazy">
              </div>
              <div class="venue-content">
                <h3 class="highlight-card-title" data-i18n="home.venueTitle"></h3>
                <p class="highlight-card-body" data-i18n="home.venueBody1"></p>
                <p class="highlight-card-body mt-sm" data-i18n="home.venueBody2"></p>
              </div>
              <div class="venue-map">
                <iframe 
                  src="https://maps.google.com/maps?q=Villa+Mona+Lisa+Montenegro&t=&z=10&ie=UTF8&iwloc=&output=embed"
                  width="100%" 
                  height="200" 
                  style="border:0;" 
                  allowfullscreen="" 
                  loading="lazy" 
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
                <a href="https://maps.app.goo.gl/eb7QNK1TuarS9A2M8" target="_blank" rel="noopener" class="venue-map-overlay">
                  <span data-i18n="home.venueMapBtn">Open in Google Maps</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                  </svg>
                </a>
              </div>
            </div>
            <div class="highlight-card highlight-card-dates reveal-item">
              <h3 class="highlight-card-title highlight-card-title-large" data-i18n="home.datesTitle"></h3>
              <p class="highlight-card-body" data-i18n="home.datesBody"></p>
              <p class="highlight-card-body dates-arrival" data-i18n="home.datesArrival"></p>
              
              <!-- May 2026 Calendar -->
              <div class="calendar-graphic">
              <svg viewBox="0 0 280 230" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#faf9f7"/>
                    <stop offset="100%" style="stop-color:#f0ede8"/>
                  </linearGradient>
                  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
                  </filter>
                </defs>
                
                <!-- Calendar body -->
                <rect x="10" y="20" width="260" height="200" rx="8" fill="url(#pageGradient)" filter="url(#shadow)"/>
                
                <!-- Header bar -->
                <rect x="10" y="20" width="260" height="45" rx="8" fill="#9b7e6b"/>
                <rect x="10" y="45" width="260" height="20" fill="#9b7e6b"/>
                
                <!-- Month title -->
                <text x="140" y="50" text-anchor="middle" fill="#fff" font-family="'Cormorant Garamond', serif" font-size="22" font-weight="500">May 2026</text>
                
                <!-- Binding rings -->
                <circle cx="70" cy="20" r="6" fill="#c4a98b" stroke="#9b7e6b" stroke-width="2"/>
                <circle cx="140" cy="20" r="6" fill="#c4a98b" stroke="#9b7e6b" stroke-width="2"/>
                <circle cx="210" cy="20" r="6" fill="#c4a98b" stroke="#9b7e6b" stroke-width="2"/>
                
                <!-- Day headers (centered: 7 columns from x=30 to x=250, spacing=36.67) -->
                <g fill="#6b6560" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500">
                  <text x="32" y="85" text-anchor="middle">SUN</text>
                  <text x="68" y="85" text-anchor="middle">MON</text>
                  <text x="104" y="85" text-anchor="middle">TUE</text>
                  <text x="140" y="85" text-anchor="middle">WED</text>
                  <text x="176" y="85" text-anchor="middle">THU</text>
                  <text x="212" y="85" text-anchor="middle">FRI</text>
                  <text x="248" y="85" text-anchor="middle">SAT</text>
                </g>
                
                <!-- Calendar days -->
                <g fill="#2c2825" font-family="'Montserrat', sans-serif" font-size="13">
                  <!-- Week 1: May 1-2 (Fri-Sat) -->
                  <text x="212" y="108" text-anchor="middle">1</text>
                  <text x="248" y="108" text-anchor="middle">2</text>
                  
                  <!-- Week 2: 3-9 -->
                  <text x="32" y="130" text-anchor="middle">3</text>
                  <text x="68" y="130" text-anchor="middle">4</text>
                  <text x="104" y="130" text-anchor="middle">5</text>
                  <text x="140" y="130" text-anchor="middle">6</text>
                  <text x="176" y="130" text-anchor="middle">7</text>
                  <text x="212" y="130" text-anchor="middle">8</text>
                  <text x="248" y="130" text-anchor="middle">9</text>
                  
                  <!-- Week 3: 10-16 -->
                  <text x="32" y="152" text-anchor="middle">10</text>
                  <text x="68" y="152" text-anchor="middle">11</text>
                  <text x="104" y="152" text-anchor="middle">12</text>
                  <text x="140" y="152" text-anchor="middle">13</text>
                  <text x="176" y="152" text-anchor="middle">14</text>
                  <text x="212" y="152" text-anchor="middle">15</text>
                  <text x="248" y="152" text-anchor="middle">16</text>
                  
                  <!-- Week 4: 17-23 -->
                  <text x="32" y="174" text-anchor="middle">17</text>
                  <text x="68" y="174" text-anchor="middle">18</text>
                  <text x="104" y="174" text-anchor="middle">19</text>
                  <text x="140" y="174" text-anchor="middle">20</text>
                  <text x="176" y="174" text-anchor="middle">21</text>
                  <text x="212" y="174" text-anchor="middle">22</text>
                  <text x="248" y="174" text-anchor="middle">23</text>
                  
                  <!-- Week 5: 24-30 -->
                  <text x="32" y="196" text-anchor="middle" fill="#9b7e6b" font-weight="600">24</text>
                  <!-- 25 has heart - rendered separately -->
                  <text x="104" y="196" text-anchor="middle" fill="#9b7e6b" font-weight="600">26</text>
                  <text x="140" y="196" text-anchor="middle">27</text>
                  <text x="176" y="196" text-anchor="middle">28</text>
                  <text x="212" y="196" text-anchor="middle">29</text>
                  <text x="248" y="196" text-anchor="middle">30</text>
                  
                  <!-- Week 6: 31 -->
                  <text x="32" y="215" text-anchor="middle">31</text>
                </g>
                
                <!-- Large heart for May 25 -->
                <path d="M68 180 C60 170, 46 174, 46 186 C46 198, 68 212, 68 212 C68 212, 90 198, 90 186 C90 174, 76 170, 68 180" fill="#c4a98b"/>
                
                <!-- The 25 date (white, on top of heart) -->
                <text x="68" y="196" text-anchor="middle" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700">25</text>
              </svg>
            </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============================================
           SCHEDULE SECTION
           ============================================ -->
      <section id="schedule" class="section section-alt reveal">
        <div class="container container-narrow">
          <div class="section-header text-center">
            <h2 class="section-title-large" data-i18n="schedule.title"></h2>
            <p class="section-subtitle" data-i18n="schedule.subtitle"></p>
          </div>

          <div class="text-center mb-xl">
            <p class="section-subtitle" data-i18n="schedule.placeholderNote"></p>
          </div>

          <!-- Day Cards -->
          <div class="day-card mb-lg reveal-item">
            <h3 class="day-card-title" data-i18n="schedule.day1.title"></h3>
            <ul>
              <li data-i18n="schedule.day1.b1"></li>
              <li data-i18n="schedule.day1.b2"></li>
            </ul>
          </div>

          <div class="day-card mb-lg reveal-item">
            <h3 class="day-card-title" data-i18n="schedule.day2.title"></h3>
            <ul>
              <li data-i18n="schedule.day2.b1"></li>
              <li data-i18n="schedule.day2.b2"></li>
            </ul>
          </div>

          <div class="day-card mb-lg reveal-item">
            <h3 class="day-card-title" data-i18n="schedule.day3.title"></h3>
            <ul>
              <li data-i18n="schedule.day3.b1"></li>
              <li data-i18n="schedule.day3.b2"></li>
            </ul>
          </div>

          <!-- Callout -->
          <div class="callout reveal-item" data-i18n="schedule.callout"></div>
        </div>
      </section>

      <!-- ============================================
           RSVP SECTION
           ============================================ -->
      <section id="rsvp" class="section reveal">
        <div class="container container-narrow">
          <div class="rsvp-header text-center">
            <h2 class="rsvp-title" data-i18n="rsvp.title"></h2>
            <p class="rsvp-subtitle" data-i18n="rsvp.subtitle"></p>
          </div>

          <!-- Deadline -->
          <div class="rsvp-deadline reveal-item">
            <span class="rsvp-deadline-label" data-i18n="rsvp.deadlineTitle"></span>
            <span class="rsvp-deadline-value" data-i18n="rsvp.deadlineBody"></span>
          </div>

          <!-- Google Form Embed -->
          <div class="reveal-item">
            <div class="rsvp-form-container">
              <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeRtIj-G27TjVBCIqLlzM7OkBfrYSOaKqbZtJ_QBGmUq4m0iA/viewform?embedded=true" width="100%" height="1000" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            </div>
          </div>
        </div>
      </section>

      <!-- ============================================
           FAQ SECTION
           ============================================ -->
      <section id="faq" class="section section-alt reveal">
        <div class="container container-narrow">
          <div class="section-header text-center">
            <h2 class="section-title-large" data-i18n="faq.title"></h2>
            <p class="section-subtitle" data-i18n="faq.subtitle"></p>
          </div>
          
          <!-- Basics Section -->
          <div class="faq-section reveal-item">
            <h3 class="faq-section-title" data-i18n="faq.basics.title"></h3>
            
            <div class="faq-item">
              <button class="faq-question" data-i18n="faq.basics.q1"></button>
              <div class="faq-answer">
                <p data-i18n="faq.basics.a1"></p>
              </div>
            </div>
            
            <div class="faq-item">
              <button class="faq-question" data-i18n="faq.basics.q2"></button>
              <div class="faq-answer">
                <p data-i18n="faq.basics.a2"></p>
              </div>
            </div>
          </div>

          <!-- Dress Code Section -->
          <div class="faq-section reveal-item">
            <h3 class="faq-section-title" data-i18n="faq.dress.title"></h3>
            
            <div class="faq-item">
              <button class="faq-question" data-i18n="faq.dress.q1"></button>
              <div class="faq-answer">
                <p data-i18n="faq.dress.a1"></p>
              </div>
            </div>
          </div>

          <!-- Menu Section -->
          <div class="faq-section reveal-item">
            <h3 class="faq-section-title" data-i18n="faq.menu.title"></h3>
            
            <div class="faq-item">
              <button class="faq-question" data-i18n="faq.menu.q1"></button>
              <div class="faq-answer">
                <p data-i18n="faq.menu.a1"></p>
              </div>
            </div>
          </div>

          <!-- Gifts Section -->
          <div class="faq-section reveal-item">
            <h3 class="faq-section-title" data-i18n="faq.gifts.title"></h3>
            
            <div class="faq-item">
              <button class="faq-question" data-i18n="faq.gifts.q1"></button>
              <div class="faq-answer">
                <p data-i18n="faq.gifts.a1"></p>
              </div>
            </div>
          </div>

          <!-- Transport Section -->
          <div class="faq-section reveal-item">
            <h3 class="faq-section-title" data-i18n="faq.transport.title"></h3>
            
            <div class="faq-item">
              <button class="faq-question" data-i18n="faq.transport.q1"></button>
              <div class="faq-answer">
                <p data-i18n="faq.transport.a1"></p>
              </div>
            </div>
          </div>

          <!-- Updates Section -->
          <div class="faq-section reveal-item">
            <h3 class="faq-section-title" data-i18n="faq.updates.title"></h3>
            
            <div class="faq-item">
              <button class="faq-question" data-i18n="faq.updates.q1"></button>
              <div class="faq-answer">
                <p data-i18n="faq.updates.a1"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============================================
           CONTACT SECTION
           ============================================ -->
      <section id="contact" class="section reveal">
        <div class="container container-narrow">
          <div class="section-header text-center">
            <h2 class="section-title-large" data-i18n="contact.title"></h2>
            <p class="section-subtitle" data-i18n="contact.subtitle"></p>
          </div>

          <div class="card-grid">
            <!-- Primary Contact -->
            <div class="contact-card reveal-item">
              <h3 class="contact-card-title" data-i18n="contact.primary.title"></h3>
              <p class="card-body" data-i18n="contact.primary.body"></p>
              
              <dl class="contact-info">
                <dt data-i18n="contact.primary.emailLabel"></dt>
                <dd data-i18n="contact.primary.emailValue"></dd>
                
                <dt data-i18n="contact.primary.phoneLabel"></dt>
                <dd data-i18n="contact.primary.phoneValue"></dd>
              </dl>
            </div>

            <!-- Day-of Contact -->
            <div class="contact-card reveal-item">
              <h3 class="contact-card-title" data-i18n="contact.dayof.title"></h3>
              <p class="card-body" data-i18n="contact.dayof.body"></p>
            </div>
          </div>
        </div>
      </section>

      <!-- Photo Gallery -->
      <section class="section section-alt reveal">
        <div class="container">
          <div class="text-center mb-xl">
            <h2 class="section-title" data-i18n="home.galleryTitle"></h2>
            <p class="section-subtitle" data-i18n="home.galleryBody"></p>
          </div>
          
          <div class="gallery-grid" id="gallery">
            <a href="/photos/IMG_1050.jpeg" class="gallery-item reveal-item" data-pswp-width="1200" data-pswp-height="800">
              <img src="/photos/IMG_1050.jpeg" alt="Save the Date" loading="lazy" decoding="async">
            </a>
            <a href="/photos/IMG_4966.jpeg" class="gallery-item reveal-item" data-pswp-width="1200" data-pswp-height="800">
              <img src="/photos/IMG_4966.jpeg" alt="Oleh & Inna" loading="lazy" decoding="async">
            </a>
            <a href="/photos/IMG_4985.jpeg" class="gallery-item reveal-item" data-pswp-width="1200" data-pswp-height="800">
              <img src="/photos/IMG_4985.jpeg" alt="Oleh & Inna" loading="lazy" decoding="async">
            </a>
          </div>
        </div>
      </section>

    </div>
  </main>
  
  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
